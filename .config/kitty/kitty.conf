# VS Code Dark+ Theme for Kitty

# Fonts
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.0

# Window customization
window_padding_width 12
confirm_os_window_close 0
enable_audio_bell no

# Colors

# The basic colors
foreground              #cccccc
background              #1e1e1e
selection_foreground    #1e1e1e
selection_background    #cccccc

# Cursor colors
cursor                  #cccccc
cursor_text_color       #1e1e1e

# URL underline color when hovering with mouse
url_color               #3b8eea

# Kitty window border colors
active_border_color     #3b8eea
inactive_border_color   #666666
bell_border_color       #f5f543

# OS Window titlebar colors
wayland_titlebar_color system
macos_titlebar_color system

# Tab bar colors
active_tab_foreground   #1e1e1e
active_tab_background   #cccccc
inactive_tab_foreground #e5e5e5
inactive_tab_background #1e1e1e
tab_bar_background      #1e1e1e

# Colors for marks (marked text in the terminal)
mark1_foreground #1e1e1e
mark1_background #3b8eea
mark2_foreground #1e1e1e
mark2_background #f5f543
mark3_foreground #1e1e1e
mark3_background #11a8cd

# The 16 terminal colors

# black
color0 #000000
color8 #666666

# red
color1 #cd3131
color9 #f14c4c

# green
color2  #0dbc79
color10 #23d18b

# yellow
color3  #e5e510
color11 #f5f543

# blue
color4  #2472c8
color12 #3b8eea

# magenta
color5  #bc3fbc
color13 #d670d6

# cyan
color6  #11a8cd
color14 #29b8db

# white
color7  #e5e5e5
color15 #e5e5e5

# Performance
repaint_delay 5
input_delay 1

# Scrollback & Remote Control
scrollback_pager less --chop-long-lines --RAW-CONTROL-CHARS +INPUT_LINE_NUMBER
allow_remote_control yes

# Keybinds
map ctrl+t new_tab
map ctrl+n new_os_window
map ctrl+w close_tab
map ctrl+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-args --exact -i

# Tab navigation
map ctrl+1 previous_tab
map ctrl+2 next_tab

# Copy / Paste
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard

# Stop a process (send interrupt — Ctrl+Shift+C)
map ctrl+shift+c send_text all \x03

# Wallust dynamic theme
include kitty-themes/01-Wallust.conf
