# ==============================================================================
#  Picom Configuration - Replicating Hyprland Blur & Transparency
# ==============================================================================

backend = "glx";
glx-no-stencil = true;
glx-copy-from-front = false;
vsync = true;

# Shadows
shadow = true;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.65;
shadow-exclude = [
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'i3lock'",
  "class_g = 'unlock_fader'",
  "_GTK_FRAME_EXTENTS"
];

# Fading (Animations)
fading = true;
fade-in-step = 0.04;
fade-out-step = 0.04;
fade-delta = 6;
fade-exclude = [
  "class_g = 'i3lock'",
  "class_g = 'unlock_fader'"
];

# Window Animations (Picom v12)
animations = (
  {
    triggers = [ "close", "hide" ];
    preset = "disappear";
    duration = 0.22;
    scale = 0.98;
  },
  {
    triggers = [ "open", "show" ];
    preset = "appear";
    duration = 0.20;
    scale = 0.98;
  }
);

# Opacity
inactive-opacity = 0.92;
frame-opacity = 1.0;
active-opacity = 1.0;
inactive-dim = 0.08;
focus-exclude = [
  "class_g = 'i3lock'",
  "class_g = 'unlock_fader'"
];
opacity-rule = [
  "0:class_g = 'i3lock'"
];

# Rounded Corners
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'Polybar'",
  "class_g = 'i3lock'",
  "class_g = 'unlock_fader'"
];

# Dual Kawase Blur (Matching Hyprland blur)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = true;
blur-background-fixed = true;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'slop'",
  "class_g = 'Polybar'",
  "class_g = 'i3lock'",
  "class_g = 'unlock_fader'",
  "_GTK_FRAME_EXTENTS"
];

# General Settings
mark-wmwin-focused = true;
mark-ovredir-focused = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
use-damage = true;
log-level = "warn";
