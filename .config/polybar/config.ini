; /* ---- 💫 Polybar configuration for i3 & dots ecosystem 💫 ---- */
[global/wm]
margin-bottom = 0
margin-top = 0

include-file = ~/.config/polybar/colors.ini

[bar/main]
monitor = ${env:MONITOR:}
width = 100%
height = 28pt
radius = 8

fixed-center = true
screenchange-reload = true

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 2
padding-right = 2
module-margin = 1

separator = ""

font-0 = JetBrainsMono Nerd Font:style=Bold:size=10;2
font-1 = JetBrainsMono Nerd Font:size=12;3
font-2 = JetBrainsMono Nerd Font:size=14;4

modules-left = launcher xwindow
modules-center = weather i3 date
modules-right = pulseaudio wlan sysdrawer battery tray-toggle tray nightlight notification powermenu

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[bar/secondary]
inherit = bar/main
modules-right = pulseaudio wlan sysdrawer battery nightlight notification powermenu

; ==============================================================================
;  MODULES - LEFT
; ==============================================================================

[module/launcher]
type = custom/text
label = "󰣇 "
label-font = 3
label-foreground = ${colors.primary}
click-left = rofi -show drun -modi drun,run,window

[module/xwindow]
type = internal/xwindow
label =  %title:0:30:...%
label-maxlen = 30
label-foreground = ${colors.foreground}
label-empty =

; ==============================================================================
;  MODULES - CENTER (WEATHER + WORKSPACES)
; ==============================================================================

[module/weather]
type = custom/script
exec = ~/.config/polybar/scripts/weather.sh
interval = 900
format = <label>
format-padding = 1
format-foreground = ${colors.secondary}
click-left = xdg-open "https://wttr.in"

; ==============================================================================
;  MODULES - CENTER (WORKSPACES - LOCKED DEAD CENTER)
; ==============================================================================

[module/i3]
type = internal/i3
format = <label-state> <label-mode>
index-sort = true
wrapping-scroll = false
pin-workspaces = false

label-mode-padding = 2
label-mode-foreground = ${colors.background}
label-mode-background = ${colors.primary}

label-focused = %name%
label-focused-foreground = ${colors.background}
label-focused-background = ${colors.primary}
label-focused-padding = 2

label-unfocused = %name%
label-unfocused-foreground = ${colors.disabled}
label-unfocused-padding = 2

label-visible = %name%
label-visible-foreground = ${colors.foreground}
label-visible-background = ${colors.background-alt}
label-visible-padding = 2

label-urgent = %name%
label-urgent-foreground = ${colors.background}
label-urgent-background = ${colors.alert}
label-urgent-padding = 2

; ==============================================================================
;  MODULES - RIGHT
; ==============================================================================

; [module/media]
; type = custom/script
; exec = ~/.config/i3/scripts/polybar_media.sh
; interval = 2
; label = %output:0:14:...%
; label-maxlen = 14
; label-foreground = ${colors.secondary}
; click-left = playerctl play-pause 2>/dev/null
; click-right = playerctl next 2>/dev/null
; click-middle = playerctl previous 2>/dev/null

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <ramp-volume> <label-volume>
label-volume = %percentage%%
label-volume-foreground = ${colors.foreground}

label-muted = 󰝟 Muted
label-muted-foreground = ${colors.alert}

ramp-volume-0 = 
ramp-volume-1 = 
ramp-volume-2 = 
ramp-volume-foreground = ${colors.primary}
click-right = pavucontrol &

[module/wlan]
type = internal/network
interface-type = wireless
interval = 3.0

format-connected = <ramp-signal>
label-connected = ""

format-disconnected = <label-disconnected>
label-disconnected = 󰤭
label-disconnected-foreground = ${colors.disabled}

ramp-signal-0 = 󰤯
ramp-signal-1 = 󰤟
ramp-signal-2 = 󰤢
ramp-signal-3 = 󰤥
ramp-signal-4 = 󰤨
ramp-signal-foreground = ${colors.primary}

click-left = nm-connection-editor &

; Collapsible System Specs Drawer (IPC Based: Hover to expand, Click to toggle)
[module/sysdrawer]
type = custom/ipc
hook-0 = ~/.config/polybar/scripts/sysdrawer.sh collapsed
hook-1 = ~/.config/polybar/scripts/sysdrawer.sh expanded
initial = 1
click-left = ~/.config/polybar/scripts/sysdrawer.sh toggle
format-padding = 1

[module/battery]
type = internal/battery
battery = BAT0
adapter = AC
poll-interval = 3
full-at = 98

format-charging = <animation-charging> <label-charging>
label-charging = " %percentage%%"
label-charging-foreground = ${colors.foreground}

format-discharging = <ramp-capacity> <label-discharging>
label-discharging = " %percentage%%"
label-discharging-foreground = ${colors.foreground}

format-full = <ramp-capacity> <label-full>
label-full = " %percentage%%"
label-full-foreground = ${colors.foreground}

ramp-capacity-0 = 󰂃
ramp-capacity-1 = 󰁺
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁾
ramp-capacity-4 = 󰂀
ramp-capacity-5 = 󰁹
ramp-capacity-foreground = ${colors.primary}

animation-charging-0 = 󰂆
animation-charging-1 = 󰂈
animation-charging-2 = 󰂉
animation-charging-3 = 󰂊
animation-charging-4 = 󰂅
animation-charging-framerate = 750
animation-charging-foreground = ${colors.primary}

[module/date]
type = internal/date
interval = 1
date =  %H:%M
date-alt =  %a, %d %b %Y   %H:%M:%S
label = %date%
label-foreground = ${colors.primary}
format-padding = 1

; Windows-style Collapsible System Tray Drawer (Background processes)
[module/tray-toggle]
type = custom/ipc
hook-0 = echo "%{F#A5A5A4}󰅃%{F-}"
hook-1 = echo "%{F#A97A81}󰅀%{F-}"
initial = 1
click-left = ~/.config/polybar/scripts/tray_toggle.sh
format-padding = 1

[module/tray]
type = internal/tray
tray-spacing = 6px
tray-padding = 2px
tray-size = 55%
tray-background = ${colors.background}
hidden = true

[module/nightlight]
type = custom/script
exec = ~/.config/polybar/scripts/nightlight.sh
interval = 5
format = <label>
format-foreground = ${colors.secondary}
click-left = ~/.config/i3/scripts/Hyprsunset.sh toggle

[module/notification]
type = custom/text
label = 󰂚
label-foreground = ${colors.primary}
click-left = ~/.config/i3/scripts/notification_center.sh

[module/powermenu]
type = custom/text
label = " "
label-foreground = ${colors.alert}
click-left = ~/.config/i3/scripts/Wlogout.sh
